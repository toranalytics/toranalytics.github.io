name: Deploy blog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn
      - name: Install dependencies (retry for transient download failures)
        run: |
          for attempt in 1 2 3 4; do
            yarn install --frozen-lockfile --network-timeout 600000 && exit 0
            echo "yarn install failed (attempt $attempt), retrying"
            sleep $((attempt * 20))
          done
          exit 1
      - run: yarn build
      - run: node scripts/check-search-output.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
