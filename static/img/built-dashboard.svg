<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" role="img" aria-labelledby="t d">
  <title id="t">마케팅 리포트 도식</title>
  <desc id="d">막대그래프 아래에 무슨 일이 있었는지, 왜 이 숫자인지, 다음에 볼 것을 설명으로 붙인 리포트 화면의 도식.</desc>
  <rect width="600" height="520" fill="#F4EFE6"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="30" y="50" font-size="20" fill="#78716C">report<tspan fill="#C2410C">_</tspan></text>
    <text x="570" y="50" font-size="16" fill="#A8A29E" text-anchor="end">도식 · 실제 데이터 아님</text>
  </g>
  <rect x="30" y="72" width="540" height="228" fill="#FFFFFF" stroke="#D6D3D1" stroke-width="2"/>
  <text x="50" y="108" font-family="'Iowan Old Style','Apple Myungjo','Noto Serif KR',Georgia,serif" font-size="22" font-weight="700" fill="#1C1917">이번 주 광고 결과</text>
  <g fill="#D6D3D1">
    <rect x="56" y="214" width="46" height="56"/><rect x="118" y="196" width="46" height="74"/>
    <rect x="180" y="206" width="46" height="64"/><rect x="242" y="164" width="46" height="106"/>
    <rect x="304" y="134" width="46" height="136"/><rect x="366" y="170" width="46" height="100"/>
    <rect x="428" y="184" width="46" height="86"/><rect x="490" y="200" width="46" height="70"/>
  </g>
  <rect x="242" y="164" width="46" height="106" fill="#FDBA74"/>
  <rect x="304" y="134" width="46" height="136" fill="#C2410C"/>
  <line x1="46" y1="270" x2="554" y2="270" stroke="#A8A29E" stroke-width="2"/>
  <g font-family="'Iowan Old Style','Apple Myungjo','Noto Serif KR',Georgia,serif">
    <rect x="30" y="316" width="540" height="58" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
    <text x="48" y="342" font-size="20" font-weight="700" fill="#9A3412">무슨 일이 있었나</text>
    <text x="48" y="364" font-size="16" fill="#7C2D12">숫자가 움직인 날에 바뀐 것</text>
    <rect x="30" y="384" width="540" height="58" fill="#FFFFFF" stroke="#D6D3D1" stroke-width="2"/>
    <text x="48" y="410" font-size="20" font-weight="700" fill="#1C1917">왜 이 숫자인가</text>
    <text x="48" y="432" font-size="16" fill="#57534E">원인으로 보는 근거와 한계</text>
    <rect x="30" y="452" width="540" height="58" fill="#FFFFFF" stroke="#D6D3D1" stroke-width="2"/>
    <text x="48" y="478" font-size="20" font-weight="700" fill="#1C1917">다음에 볼 것</text>
    <text x="48" y="500" font-size="16" fill="#57534E">보는 사람이 바로 판단하도록 숫자 옆에 설명을 붙인다</text>
  </g>
  <g fill="none" stroke="#C2410C" stroke-width="2.5" stroke-linecap="round">
    <path d="M327 130C327 100 520 96 520 96" opacity="0"/>
  </g>
</svg>
